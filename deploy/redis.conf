# ==============================================================================
# ScamON Enterprise Email Analysis Agent - Staging Redis Configuration
# ==============================================================================

# Network binding
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management & Eviction
maxmemory 512mb
maxmemory-policy volatile-lru
maxmemory-samples 5

# Persistence Configuration
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging & Client Limits
loglevel notice
maxclients 10000
slowlog-log-slower-than 10000
slowlog-max-len 128
