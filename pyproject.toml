[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "email-analysis-agent"
version = "0.1.0"
description = "Foundation service for the ScamShield AI Email Analysis Agent."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "tldextract>=5.1,<6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.38",
    "asyncpg>=0.30.0",
    "alembic>=1.14.1",
    "psycopg[binary]>=3.2.4",
    "redis>=5.0.0",
    "pgvector>=0.3.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N802", "N818", "E402", "UP046", "F401", "W291"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["src"]

[[tool.mypy.overrides]]
module = "selectolax.*"
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[tool.pyrefly]
project_root = "."
search_path = ["."]


